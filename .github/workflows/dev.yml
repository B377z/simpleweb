on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  test-development:
    runs-on: ubuntu-latest

    services:
      subscribe-database:
        image: mongo
        options: >-
          --network-alias subscribe-database

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: |
          cd backend
          npm test

      - name: Setup Environment Variables
        run: |
          echo "REACT_APP_API_URL=http://localhost:3000" >> $GITHUB_ENV
          echo "DATABASE_URL=mongodb://subscribe-database:27017/ThaZoneDev" >> $GITHUB_ENV

      - name: Build and Run Docker Compose for Dev
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d
        env:
          REACT_APP_API_URL: http://localhost:3000
          DATABASE_URL: mongodb://subscribe-database:27017/ThaZoneDev

      - name: Wait for MongoDB to be ready
        run: |
          for i in {1..30}; do
            if docker compose exec subscribe-database mongo --eval "print('MongoDB is ready')" &>/dev/null; then
              echo "MongoDB is ready"
              break
            fi
            echo "Waiting for MongoDB to start..."
            sleep 5
          done

      - name: Run Backend Tests
        run: docker compose exec subscribe-backend npm test

      - name: Capture Logs for Debugging
        if: failure()
        run: |
          echo "Backend logs:"
          docker compose logs subscribe-backend
          echo "Database logs:"
          docker compose logs subscribe-database

      - name: Tear Down Docker Compose
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down
