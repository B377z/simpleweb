
name: Development Workflow

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  test-development:
    runs-on: ubuntu-latest

    services:
      subscribe-database:
        image: mongo
        ports:
          - "27017:27017"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '14'

      - name: Setup Environment Variables
        run: |
          echo "REACT_APP_API_URL=http://localhost:3000" >> $GITHUB_ENV
          echo "DATABASE_URL=mongodb://subscribe-database:27017/ThaZoneDev" >> $GITHUB_ENV

      - name: Build and Run Docker Compose for Dev
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d

      # Improved MongoDB readiness check with timeout and log capture
      - name: Wait for MongoDB to be ready
        run: |
          ATTEMPTS=0
          MAX_ATTEMPTS=30
          until docker compose exec subscribe-database mongo --eval "print('MongoDB is ready')" &> /dev/null
          do
            if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
              echo "MongoDB failed to start within expected time."
              echo "Capturing MongoDB logs for debugging:"
              docker compose logs subscribe-database
              exit 1
            fi
            echo "Waiting for MongoDB to start..."
            ATTEMPTS=$((ATTEMPTS + 1))
            sleep 5
          done

      - name: Run Backend Tests
        run: docker compose exec subscribe-backend npm test

      # Capture logs for debugging if there is a failure
      - name: Capture Logs for Debugging
        if: failure()
        run: |
          echo "Backend logs:"
          docker compose logs subscribe-backend
          echo "Database logs:"
          docker compose logs subscribe-database

      - name: Tear Down Docker Compose
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down
