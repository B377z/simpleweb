services:
  subscribe-database:
    image: mongo
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - default  # Use the default network

  subscribe-backend:
    build:
      context: ./backend
    environment:
      - NODE_ENV=development
      - DATABASE_URL=mongodb://subscribe-database:27017/ThaZoneDev  # Use the existing IP
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
    command: npm run dev
    depends_on:
      - subscribe-database
    networks:
      - default

  subscribe-frontend:
    build:
      context: ./client
      args:
        - REACT_APP_API_URL=http://subscribe-backend:3000
    ports:
      - "3001:80"
    volumes:
      - ./client:/app
    depends_on:
      - subscribe-backend
    networks:
      - default

volumes:
  mongo-data:

networks:
  simpleweb_default:
    external: true

